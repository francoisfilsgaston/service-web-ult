<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Gestion des utilisateurs</title>
	</head>
	<body>
		<h1>Enregistre un utilisateur</h1>
		<form id="userForm">
			<label for="name">Nom</label>
			<input type="text" id="name" placeholder="Entre votre nom" required="true"></br>
			<label for="email">Email</label>
			<input type="email" id="email" placeholder="Entre votre E-mail" required="true"></br>
			<label for="number">Telephone</label>
			<input type="text" id="number" placeholder="Entre votre contact" required="true"></br>
			<button type="submit">Enregistre</button>
		</form>
		<h1>Liste des utilisateurs</h1>
		<table>
			<thead>
				<tr>
					<th>ID</th>
					<th>Nom</th>
					<th>Email</th>
					<th>Contact</th>
					<th>Action</th>
				</tr>
				<tbody id="listeUser">
				
				</tbody>
			</thead>
		</table>
		<script src="./userForm.js"></script>
	</body>
</html>
